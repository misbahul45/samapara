name: sampara-api-platform-workspace

services:
  api_platform:
    build:
      context: ..
      dockerfile: Dockerfile.dev
    init: true
    working_dir: /app
    env_file:
      - ../../../.env
    environment:
      NODE_ENV: development
      PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PRISMA_DATABASE_URL: postgresql://${POSTGRES_OWNER_USER}:${POSTGRES_OWNER_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DECISION_ENGINE_URL: http://host.docker.internal:8000
      TELEMETRY_WORKER_URL: http://host.docker.internal:8080
      PUBLIC_ORIGINS: ${PUBLIC_ORIGINS},http://localhost:3000,http://127.0.0.1:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3002:3002"
    volumes:
      - ..:/app:cached
      - api_platform_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_OWNER_USER: ${POSTGRES_OWNER_USER}
      POSTGRES_OWNER_PASSWORD: ${POSTGRES_OWNER_PASSWORD}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      POSTGRES_INGESTOR_USER: ${POSTGRES_INGESTOR_USER}
      POSTGRES_INGESTOR_PASSWORD: ${POSTGRES_INGESTOR_PASSWORD}
      POSTGRES_AI_USER: ${POSTGRES_AI_USER}
      POSTGRES_AI_PASSWORD: ${POSTGRES_AI_PASSWORD}
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb,pg_stat_statements
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../../infra/postgres/init/001-init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - ../../../infra/postgres/init/003-roles.sh:/docker-entrypoint-initdb.d/003-roles.sh:ro
      - ../../../infra/postgres/grants.sql:/docker-entrypoint-initdb.d/004-grants.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.8.0-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - -a
        - ${REDIS_PASSWORD}
        - PING
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  api_platform_node_modules:
  postgres_data:
  redis_data:
