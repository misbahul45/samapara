name: samapara-decision-engine-workspace

services:
  decision_engine:
    build:
      context: ..
      dockerfile: Dockerfile.dev
    init: true
    working_dir: /app
    env_file:
      - ../../../.env
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql://${POSTGRES_AI_USER}:${POSTGRES_AI_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION}
      API_PLATFORM_URL: http://host.docker.internal:3002
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ..:/app:cached
      - decision_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  postgres:
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_OWNER_USER: ${POSTGRES_OWNER_USER}
      POSTGRES_OWNER_PASSWORD: ${POSTGRES_OWNER_PASSWORD}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      POSTGRES_INGESTOR_USER: ${POSTGRES_INGESTOR_USER}
      POSTGRES_INGESTOR_PASSWORD: ${POSTGRES_INGESTOR_PASSWORD}
      POSTGRES_AI_USER: ${POSTGRES_AI_USER}
      POSTGRES_AI_PASSWORD: ${POSTGRES_AI_PASSWORD}
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb,pg_stat_statements
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../../infra/postgres/init/001-init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - ../../../infra/postgres/init/003-roles.sh:/docker-entrypoint-initdb.d/003-roles.sh:ro
      - ../../../infra/postgres/grants.sql:/docker-entrypoint-initdb.d/004-grants.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.8.0-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - -a
        - ${REDIS_PASSWORD}
        - PING
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.18.1
    environment:
      QDRANT__LOG_LEVEL: INFO
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
      QDRANT__SERVICE__READ_ONLY_API_KEY: ${QDRANT_READ_ONLY_API_KEY}
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  decision_venv:
  postgres_data:
  redis_data:
  qdrant_data:
