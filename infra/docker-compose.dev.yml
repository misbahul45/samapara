name: samapara-dev

networks:
  samapara_net:
    driver: bridge

services:
  controll:
    build:
      context: ../apps/samapara_controll
      dockerfile: Dockerfile.dev
    container_name: samapara_controll_dev
    env_file:
      - ../.env
    environment:
      NODE_ENV: development
      PORT: 3000
      HOST: 0.0.0.0
      CI: "true"
      PNPM_CONFIG_CONFIRM_MODULES_PURGE: "false"
      API_BASE_INTERNAL: http://api_platform:3000/api
      API_BASE: /api
    volumes:
      - ../apps/samapara_controll:/app
      - controll_node_modules:/app/node_modules
    networks:
      - samapara_net

  api_platform:
    build:
      context: ../services/api_platform
      dockerfile: Dockerfile.dev
    container_name: samapara_api_platform_dev
    env_file:
      - ../.env
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DECISION_ENGINE_URL: http://decision_engine:8000
      TELEMETRY_WORKER_URL: http://telemetry_worker:8080
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      PUBLIC_ORIGINS: ${PUBLIC_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../services/api_platform:/app
      - api_platform_node_modules:/app/node_modules
    networks:
      - samapara_net

  decision_engine:
    build:
      context: ../services/decision_engine
      dockerfile: Dockerfile.dev
    container_name: samapara_decision_engine_dev
    env_file:
      - ../.env
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql://${POSTGRES_AI_USER}:${POSTGRES_AI_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION}
      API_PLATFORM_URL: http://api_platform:3000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ../services/decision_engine:/app
      - decision_venv:/app/.venv
    networks:
      - samapara_net

  decision_worker:
    build:
      context: ../services/decision_engine
      dockerfile: Dockerfile.dev
    container_name: samapara_decision_worker_dev
    env_file:
      - ../.env
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql://${POSTGRES_AI_USER}:${POSTGRES_AI_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION}
      API_PLATFORM_URL: http://api_platform:3000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    command:
      - uv
      - run
      - python
      - -m
      - decision_engine.workers.telemetry
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../services/decision_engine:/app
      - decision_venv:/app/.venv
    networks:
      - samapara_net

  telemetry_worker:
    build:
      context: ../services/telemetry_worker
      dockerfile: Dockerfile.dev
    container_name: samapara_telemetry_worker_dev
    env_file:
      - ../.env
    environment:
      GIN_MODE: release
      PORT: 8080
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      GO_DATABASE_URL: postgresql://${POSTGRES_INGESTOR_USER}:${POSTGRES_INGESTOR_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MQTT_BROKER: tcp://mosquitto:1883
      MQTT_CLIENT_ID: samapara-telemetry-worker
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started
    volumes:
      - ../services/telemetry_worker:/app
      - go_mod_cache:/go/pkg/mod
    networks:
      - samapara_net

  nginx:
    image: nginx:alpine
    container_name: samapara_nginx_dev
    depends_on:
      - controll
      - api_platform
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8090}:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    networks:
      - samapara_net

  postgres:
    image: timescale/timescaledb:latest-pg17
    container_name: samapara_postgres_dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_OWNER_USER: ${POSTGRES_OWNER_USER}
      POSTGRES_OWNER_PASSWORD: ${POSTGRES_OWNER_PASSWORD}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      POSTGRES_INGESTOR_USER: ${POSTGRES_INGESTOR_USER}
      POSTGRES_INGESTOR_PASSWORD: ${POSTGRES_INGESTOR_PASSWORD}
      POSTGRES_AI_USER: ${POSTGRES_AI_USER}
      POSTGRES_AI_PASSWORD: ${POSTGRES_AI_PASSWORD}
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb,pg_stat_statements
      - -c
      - max_connections=100
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=8MB
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - samapara_net

  redis:
    image: redis:8.8.0-alpine
    container_name: samapara_redis_dev
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - -a
        - ${REDIS_PASSWORD}
        - PING
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - samapara_net

  qdrant:
    image: qdrant/qdrant:v1.18.1
    container_name: samapara_qdrant_dev
    environment:
      QDRANT__LOG_LEVEL: INFO
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
      QDRANT__SERVICE__READ_ONLY_API_KEY: ${QDRANT_READ_ONLY_API_KEY}
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_dev_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - samapara_net

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: samapara_mosquitto_dev
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/dev.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_dev_data:/mosquitto/data
    restart: unless-stopped
    networks:
      - samapara_net

  minio:
    image: minio/minio:latest
    container_name: samapara_minio_dev
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_dev_data:/data
    restart: unless-stopped
    networks:
      - samapara_net

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.19.1
    container_name: samapara_postgres_exporter_dev
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - samapara_net

  prometheus:
    image: prom/prometheus:v3.10.0
    container_name: samapara_prometheus_dev
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    environment:
      QDRANT_READ_ONLY_API_KEY: ${QDRANT_READ_ONLY_API_KEY}
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.dev.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_dev_data:/prometheus
    restart: unless-stopped
    networks:
      - samapara_net

  loki:
    image: grafana/loki:3.7.0
    container_name: samapara_loki_dev
    command:
      - -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_dev_data:/loki
    restart: unless-stopped
    networks:
      - samapara_net

  alloy:
    image: grafana/alloy:v1.18.0
    container_name: samapara_alloy_dev
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_dev_data:/var/lib/alloy/data
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - samapara_net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: samapara_cadvisor_dev
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    restart: unless-stopped
    networks:
      - samapara_net

  grafana:
    image: grafana/grafana:13.1.0
    container_name: samapara_grafana_dev
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_dev_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    networks:
      - samapara_net

volumes:
  controll_node_modules:
  api_platform_node_modules:
  decision_venv:
  go_mod_cache:
  postgres_dev_data:
  redis_dev_data:
  qdrant_dev_data:
  mosquitto_dev_data:
  minio_dev_data:
  prometheus_dev_data:
  grafana_dev_data:
  loki_dev_data:
  alloy_dev_data: