# ============================================================
# SAMPARA — Nginx dev gateway (reverse proxy)
#
# GABUNGAN POLA DARI PROJECT SEBELUMNYA:
# - bemunair2026  : security headers, gzip, WebSocket upgrade,
#                   proxy headers, file lengkap di-mount ke
#                   /etc/nginx/nginx.conf
# - ISAC-2026     : resolver 127.0.0.11 + upstream dalam VARIABLE
#                   -> nginx TIDAK exit saat startup walau service
#                   lain belum resolve (robust)
#
# SAMPARA = gateway-only: satu-satunya entry point ke semua service.
# Service TIDAK di-publish ke host, hanya di internal network.
#
# Route table (BOUNDARY FINAL — Fase B):
#   /healthz          -> 200 ok (nginx sendiri)
#   /api/             -> api_platform    (Hono, strip prefix) — PUBLIC API BOUNDARY
#   /                 -> sampara_controll (Nuxt, + WebSocket HMR)
#
# TIDAK ada route publik ke decision_engine / telemetry_worker / qdrant /
# redis. Go & Python HANYA bisa diakses dari dalam Docker network
# (http://decision_engine:8000, http://telemetry_worker:8080) oleh api_platform.
# ============================================================

worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    server_tokens off;
    keepalive_timeout 65;
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # WebSocket upgrade (dipakai Nuxt dev HMR)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    server {
        listen 80;
        server_name localhost _;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        send_timeout 60s;

        # --- Security headers (pola bemunair2026) ---
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # --- Docker embedded DNS (pola ISAC-2026) ---
        # Upstream disimpan dalam variable (HANYA host:port, tanpa scheme —
        # scheme ditulis di proxy_pass) supaya container service yang belum
        # up saat nginx start tidak membuat nginx crash/exit.
        resolver 127.0.0.11 valid=10s ipv6=off;

        set $controll_upstream    controll:3000;
        set $api_upstream         api_platform:3000;

        # --- Health check gateway ---
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok";
        }

        # --- services/api_platform (Hono) — PUBLIC API BOUNDARY ---
        # Path /api/* diteruskan UTUH (TIDAK strip prefix): Hono sendiri yang
        # route di /api/v1/*, /api/internal/* dst. (konvensi Fase B).
        location ^~ /api/ {
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Request-ID $request_id;
        }

        # --- apps/sampara_controll (Nuxt) — dengan WebSocket utk HMR ---
        location / {
            proxy_pass http://$controll_upstream;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            proxy_cache_bypass $http_upgrade;
        }
    }
}
