# ============================================================
# SAMAPARA — Mosquitto dev config
# CATATAN: HANYA untuk development. allow_anonymous true tidak
# boleh dipakai di production (lihat infra/mosquitto/prod.conf
# pada fase production: password_file + TLS 8883).
# ============================================================

listener 1883

allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout

autosave_interval 30
