# ============================================================
# SAMAPARA — Prometheus dev config
# CATATAN: nilai secret Qdrant dev ditulis via env substitution
# ${QDRANT_READ_ONLY_API_KEY} (diset di compose service prometheus).
# Production: gunakan secret file / templating — jangan hardcode.
# ============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: qdrant
    metrics_path: /metrics
    params:
      per_collection:
        - "true"
    authorization:
      type: Bearer
      # Dev only: Prometheus tidak me-expand ${VAR} di field credentials.
      # Production: gunakan secret file / templating (jangan hardcode).
      credentials: samapara_dev_qdrant_readonly
    static_configs:
      - targets:
          - qdrant:6333

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
