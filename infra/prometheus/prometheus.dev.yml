# ============================================================
# SAMPARA — Prometheus dev config
# ============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: qdrant
    metrics_path: /metrics
    params:
      per_collection:
        - "true"
    authorization:
      type: Bearer
      # Dev only: Prometheus tidak me-expand ${VAR} di field credentials.
      # Production: gunakan secret file / templating (jangan hardcode).
      credentials: 58zoMFB69QZX2zFZGcTEhq35YOnf4Pxz5VTi805Tc4E=
    static_configs:
      - targets:
          - qdrant:6333

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
